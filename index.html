<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Images</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }

        .banner-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .banner-container img {
            max-width: 100%;
            width: 400px;
            height: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

    <h2>Banner Images</h2>

    <div class="banner-container">
        <img src="images/banner/featue-image-unique-toy1.png" alt="Banner 1">
        <img src="images/banner/featured-image-uniaue-toy2.png" alt="Banner 2">
        <img src="images/banner/Education-Toys-Main.jpg" alt="Banner 2">
    </div>

</body>
</html>
