<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner Images</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        text-align: center;
        background: #f8f9fa;
    }

    h2 {
        margin-bottom: 25px;
    }

    .banner-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 400px));
        justify-content: center;
        gap: 25px;
    }

    .banner-item {
        background: #fff;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .banner-item img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
        margin-bottom: 12px;
    }

    .url-container {
        display: flex;
        gap: 8px;
    }

    .url-input {
        flex: 1;
        min-width: 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 13px;
        background: #f5f5f5;
        color: #333;
    }

    .copy-button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        background: #1976d2;
        color: white;
        cursor: pointer;
        font-size: 13px;
        white-space: nowrap;
    }

    .copy-button:hover {
        background: #125ca8;
    }

    .copy-button.copied {
        background: #2e7d32;
    }

    .file-name {
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: bold;
        color: #444;
        word-break: break-word;
    }

    .loading {
        font-size: 16px;
        color: #666;
    }

    .error {
        color: #d32f2f;
        font-size: 16px;
    }

    @media (max-width: 600px) {
        .banner-container {
            grid-template-columns: 1fr;
        }

        .url-container {
            flex-direction: column;
        }

        .copy-button {
            width: 100%;
        }
    }
</style>

</head>

<body>

<h2>Banner Images</h2>

<div id="bannerContainer" class="banner-container">
    <div class="loading">Loading banner images...</div>
</div>

<script>

    // GitHub API
    const GITHUB_API =
        "https://api.github.com/repos/unique-toy/assets/contents/images/banner";

    // GitHub Pages base URL
    const GITHUB_PAGES_BASE =
        "https://unique-toy.github.io/assets/images/banner/";

    const bannerContainer =
        document.getElementById("bannerContainer");


    async function loadBannerImages() {

        try {

            const response = await fetch(GITHUB_API);

            if (!response.ok) {
                throw new Error(
                    `GitHub API error: ${response.status}`
                );
            }

            const files = await response.json();

            bannerContainer.innerHTML = "";

            const imageExtensions = [
                ".jpg",
                ".jpeg",
                ".png",
                ".gif",
                ".webp",
                ".svg"
            ];

            // Get only image files
            const images = files.filter(file => {

                if (file.type !== "file") {
                    return false;
                }

                const fileName = file.name.toLowerCase();

                return imageExtensions.some(extension =>
                    fileName.endsWith(extension)
                );

            });


            if (images.length === 0) {

                bannerContainer.innerHTML =
                    '<div class="error">No banner images found.</div>';

                return;
            }


            // Display every image
            images.forEach((file, index) => {

                const bannerItem =
                    document.createElement("div");

                bannerItem.className = "banner-item";


                // File name
                const fileName =
                    document.createElement("div");

                fileName.className = "file-name";

                fileName.textContent =
                    file.name;


                // Image
                const img =
                    document.createElement("img");

                img.src =
                    file.download_url;

                img.alt =
                    `Banner ${index + 1}`;

                img.loading =
                    "lazy";


                // Create GitHub Pages URL
                const imageUrl =
                    GITHUB_PAGES_BASE +
                    encodeURIComponent(file.name);


                // URL container
                const urlContainer =
                    document.createElement("div");

                urlContainer.className =
                    "url-container";


                // URL input
                const urlInput =
                    document.createElement("input");

                urlInput.type =
                    "text";

                urlInput.className =
                    "url-input";

                urlInput.value =
                    imageUrl;

                urlInput.readOnly =
                    true;


                // Copy button
                const copyButton =
                    document.createElement("button");

                copyButton.className =
                    "copy-button";

                copyButton.textContent =
                    "Copy URL";


                copyButton.addEventListener(
                    "click",
                    async function () {

                        try {

                            await navigator.clipboard.writeText(
                                imageUrl
                            );

                            copyButton.textContent =
                                "Copied!";

                            copyButton.classList.add(
                                "copied"
                            );

                            setTimeout(() => {

                                copyButton.textContent =
                                    "Copy URL";

                                copyButton.classList.remove(
                                    "copied"
                                );

                            }, 2000);

                        } catch (error) {

                            // Fallback for older browsers
                            urlInput.select();

                            document.execCommand(
                                "copy"
                            );

                            copyButton.textContent =
                                "Copied!";

                            setTimeout(() => {

                                copyButton.textContent =
                                    "Copy URL";

                            }, 2000);
                        }

                    }
                );


                // Build HTML
                urlContainer.appendChild(
                    urlInput
                );

                urlContainer.appendChild(
                    copyButton
                );


                bannerItem.appendChild(
                    fileName
                );

                bannerItem.appendChild(
                    img
                );

                bannerItem.appendChild(
                    urlContainer
                );


                bannerContainer.appendChild(
                    bannerItem
                );

            });


            console.log(
                `Loaded ${images.length} banner images.`
            );

        } catch (error) {

            console.error(
                "Error loading banner images:",
                error
            );

            bannerContainer.innerHTML =
                '<div class="error">Unable to load banner images.</div>';
        }
    }


    // Load banner images
    loadBannerImages();

</script>

</body>
</html>
