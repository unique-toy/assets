```
<h2>Banner Images</h2>

<div id="bannerContainer" class="banner-container">
    <div class="loading">Loading banner images...</div>
</div>

<script>

    // GitHub repository details
    const GITHUB_API =
        "https://api.github.com/repos/unique-toy/assets/contents/images/banner";

    const bannerContainer =
        document.getElementById("bannerContainer");

    async function loadBannerImages() {

        try {

            const response = await fetch(GITHUB_API);

            if (!response.ok) {
                throw new Error(
                    `GitHub API error: ${response.status}`
                );
            }

            const files = await response.json();

            // Remove loading message
            bannerContainer.innerHTML = "";

            // Supported image extensions
            const imageExtensions = [
                ".jpg",
                ".jpeg",
                ".png",
                ".gif",
                ".webp",
                ".svg"
            ];

            // Filter only image files
            const images = files.filter(file => {

                if (file.type !== "file") {
                    return false;
                }

                const fileName = file.name.toLowerCase();

                return imageExtensions.some(extension =>
                    fileName.endsWith(extension)
                );

            });

            if (images.length === 0) {

                bannerContainer.innerHTML =
                    '<div class="error">No banner images found.</div>';

                return;
            }

            // Display all images
            images.forEach((file, index) => {

                const img = document.createElement("img");

                // GitHub provides the direct image URL
                img.src = file.download_url;

                img.alt = `Banner ${index + 1}`;

                img.loading = "lazy";

                img.onerror = function () {
                    console.error(
                        "Unable to load image:",
                        file.name
                    );

                    img.remove();
                };

                bannerContainer.appendChild(img);

            });

            console.log(
                `Loaded ${images.length} banner images.`
            );

        } catch (error) {

            console.error(
                "Error loading banner images:",
                error
            );

            bannerContainer.innerHTML =
                '<div class="error">Unable to load banner images.</div>';
        }
    }

    // Load banners
    loadBannerImages();

</script>
